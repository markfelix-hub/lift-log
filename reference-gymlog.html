<title>Four Day Lift Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap');
/* Layout: one phone-width column. Sticky day tabs, then programme, date, set cards. Steel-blue accent, amber superset bar. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#E3E8EF; --line:#C9D1DD;
  --text:#0F1722; --muted:#5A6678;
  --accent:#2457F5; --accent-ink:#FFFFFF;
  --ok:#16794A; --ok-ink:#FFFFFF; --ok-bg:#DDF3E6;
  --warn:#9A5B00; --warn-bg:#FCEBCB; --ss:#E0861A;
  --bad:#B3261E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1218; --surface:#171D26; --surface2:#212A36; --line:#2B3544;
    --text:#E9EEF5; --muted:#8E9BB0;
    --accent:#6C8DFF; --accent-ink:#0B1020;
    --ok:#53D08A; --ok-ink:#08210F; --ok-bg:#163527;
    --warn:#F2B04C; --warn-bg:#3A2B10; --ss:#F2B04C;
    --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#171D26; --surface2:#212A36; --line:#2B3544;
  --text:#E9EEF5; --muted:#8E9BB0;
  --accent:#6C8DFF; --accent-ink:#0B1020;
  --ok:#53D08A; --ok-ink:#08210F; --ok-bg:#163527;
  --warn:#F2B04C; --warn-bg:#3A2B10; --ss:#F2B04C;
  --bad:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:700 28px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.05em;text-transform:uppercase;margin:0}
.pill{font:600 12px/1 'Barlow',sans-serif;padding:8px 12px;min-height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.err{color:var(--bad);border-color:var(--bad);cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.tab{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:700 18px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin-top:14px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 15px/1.1 'Barlow',sans-serif;cursor:pointer;padding:4px 8px}
.seg button small{display:block;font-weight:500;font-size:12px;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.dateRow{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.dateRow input[type=date]{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:600 16px 'Barlow',sans-serif;padding:0 10px}
.dateRow .wd{font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:.03em;flex:1;min-width:0}
.banner{border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--surface2);color:var(--muted)}
.prog{margin-top:14px}
.prog .t{display:flex;justify-content:space-between;font:600 14px 'Barlow',sans-serif;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.bar i.full{background:var(--ok)}
.sec-h{font:700 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.blk.ss{border-left:5px solid var(--ss)}
.ss-tag{display:inline-block;font:700 11px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:3px 7px;margin-bottom:8px}
.ex + .ex{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.ex-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ex-name{font:700 22px/1.12 'Barlow Condensed','Arial Narrow',sans-serif;min-width:0}
.target{font:600 15px/1 'Barlow Condensed',sans-serif;color:var(--muted);white-space:nowrap}
.est{font:700 10px/1 'Barlow',sans-serif;letter-spacing:.1em;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:3px 6px;margin-left:8px;vertical-align:middle}
.cue{font-size:13px;color:var(--warn);margin-top:3px}
.last{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.link{background:none;border:0;color:var(--accent);font:600 13px 'Barlow',sans-serif;padding:6px 2px;min-height:32px;text-decoration:underline;cursor:pointer}
.sets{margin-top:8px;display:grid;gap:6px}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.row.bw{grid-template-columns:24px minmax(0,1fr) 46px}
.row.hd span{font:700 11px/1 'Barlow Condensed',sans-serif;letter-spacing:.12em;color:var(--muted);text-align:center;text-transform:uppercase}
.row .n{font:700 17px/1 'Barlow Condensed',sans-serif;color:var(--muted);text-align:center}
input.num{width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:700 22px/1 'Barlow Condensed','Arial Narrow',sans-serif;text-align:center;font-variant-numeric:tabular-nums;padding:0 6px}
input.num::placeholder{color:var(--muted);opacity:.5}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row.done input.num{border-color:var(--ok)}
.chk{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.chk svg{width:22px;height:22px}
.infoText{font-size:14px;color:var(--muted);margin-top:4px}
.infoRow{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;margin-top:8px;align-items:center}
.infoRow input{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:500 16px 'Barlow',sans-serif;padding:0 10px;width:100%}
textarea{width:100%;min-height:72px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:500 16px/1.4 'Barlow',sans-serif;padding:10px 12px;resize:vertical}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:16px}
.btn{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:700 17px/1 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:0 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.hcard summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:56px}
.hcard summary::-webkit-details-marker{display:none}
.hcard .hn{font:700 20px/1.1 'Barlow Condensed',sans-serif}
.hcard .hs{font-size:13px;color:var(--muted)}
.st{font:700 11px/1 'Barlow',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.st.done{background:var(--ok-bg);color:var(--ok)}
.hbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.hex{margin-top:10px}
.hex b{font:700 17px 'Barlow Condensed',sans-serif}
.hex div{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.hact{display:flex;gap:8px;margin-top:12px}
.hact .btn{min-height:44px;font-size:15px;flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.copybox{margin-top:10px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fdate(s){var p=String(s).split('-');if(p.length!==3)return s;var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function fdateLong(s){var p=String(s).split('-');if(p.length!==3)return s;var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
function topNum(r){var m=String(r).match(/\d+/g);return m?+m[m.length-1]:null;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function has(t){return !!t&&(t.kg!=null||t.reps!=null);}
function numOrNull(v){if(v===''||v==null)return null;var n=parseFloat(v);return isFinite(n)?n:null;}

/* ---------- programme data ---------- */
/* x(name, sets, reps, cue, rest, opts). opts: bw (no weight), unit:'sec', assist, est (my addition, tagged MINE) */
function x(name,sets,reps,cue,rest,o){
  o=o||{};
  var it={name:name,sets:sets,reps:String(reps),cue:cue||'',rest:rest||0};
  Object.keys(o).forEach(function(k){it[k]=o[k];});
  it.key=slug(name)+(it.unit==='sec'?'-sec':'');
  return it;
}
function info(name,text){return {kind:'info',key:slug(name),name:name,text:text};}
var BW={bw:true},SEC={unit:'sec'},BWSEC={bw:true,unit:'sec'},MINE={est:true},AS={assist:true};
var ASSIST='Log the assistance kg. Lower is stronger.';
function warm(dowel,swing){
  return [info('Warm-up','Arm hugs 20s, arm circles 20s, trunk rotations 20s, dowel pass-through '+dowel+'s, forward and lateral leg swings '+swing+'. Light cardio first if you like.')];
}
function plan(src,note,sec){return {src:src,note:note,sections:sec};}

var G_NOTE='Exactly as Gavin wrote it (Feb/Mar sheets). Tempo 2 sec up, 2 sec down unless stated.';
var FREE_NOTE='Freestyle block built from Gavin\'s exercises. Cards tagged MINE are not from Gavin. Same rule as his: more reps first, then more weight.';
var M2_NOTE='Same sets, reps and rest as Month 1, slot for slot. Exercises are swapped for others Gavin gave you (Jan screenshots, other days). MINE = not from Gavin.';

var PROG={
 m1:{label:'Month 1',sub:'Gavin exact',
  gym:{
   push:plan('gavin',G_NOTE,[
    {h:'Warm-up',blocks:[warm(30,'30s')]},
    {h:'Core',blocks:[[x('DB Pullover-Leg Raise to Toe Reach',3,10,'Brace abs, long legs, back pressed down.',60,BW)]]},
    {h:'Main workout',blocks:[
     [x('DB Incline Bench Press',3,12,'Smooth tempo, press evenly.',0),x('Push Up',3,10,'Chest to floor, full range.',60,BW)],
     [x('DB Seated Shoulder Press',3,12,'Slow tempo, stable core.',60)],
     [x('DB Incline Bench Tricep Kickback',3,15,'Tense hard at the top, no swinging.',60)],
     [x('Seated Chest Press Machine',3,12,'Stretch chest, soft elbows.',60)],

   legs:plan('gavin',G_NOTE,[
    {h:'Warm-up',blocks:[warm(40,'20s each side')]},
    {h:'Core and glutes',blocks:[[x('DB Glute Bridge',3,'10/side','Hips tall, control the march.',0),x('Bicycles',3,50,'25 per side. Long legs, slow, controlled.',0,BW)]]},
    {h:'Main workout',blocks:[
     [x('DB Romanian Deadlift',3,10,'2-0-1-0 tempo. Soft knees, hinge back.',60)],
     [x('Seated Leg Press',3,12,'2-0-2-0 tempo. Good range, no long pauses.',60)],
     [x('Seated Leg Extension Machine',3,'10-12','2-0-2-0 tempo. Smooth, slowly down.',60)],
     [x('DB Alternating Reverse Lunge',3,'10/leg','Step back, stable torso.',45)],
     [x('Swiss Ball Leg Curl',3,'10-15','Controlled lift, slow descent.',60,BW)],
     [x('Leg Press Calf Raises',3,'15-20','Full stretch, hard squeeze.',45)]]}]),

  },
  home:{
   push:plan('gavin',G_NOTE,[

    {h:'Core',blocks:[[x('Bicycles',3,45,'Alternate with the toe reach. 15 sec rest between. Brace abs, long legs.',15,BWSEC),x('Weighted Toe Reach',3,45,'Tense abs at the top.',15,BWSEC)]]},

     [x('DB Single Arm Row',3,'12-15','Back flat, no twisting, pull from the elbow.',60)],

    {h:'Core and glutes',blocks:[[x('Bodyweight Single Leg Glute Bridge',3,'10/side','Hips tall, no rocking.',0,BW),x('Bicycles',3,50,'Long legs, slow tempo.',0,BW)]]},
    {h:'Main workout',blocks:[

     [x('DB Squat',3,12,'Chest tall, smooth tempo.',60)],
     [x('DB Alternating Reverse Lunge',3,'10/leg','Step back, stable torso.',45)],
     [x('DB Standing Calf Raise',3,15,'',45)]]}]),
   arms:plan('gavin',G_NOTE,[
    {h:'Warm-up',blocks:[warm(30,'20s each side')]},
    {h:'Core',blocks:[[x('Weighted Toe Reach',3,15,'No swing, control the descent.',0,BW),x('Reverse Crunch',3,15,'Round from abs, slow squeeze.',30,BW)]]},
    {h:'Main workout',blocks:[

     [x('DB Standing OH Tricep Extension',3,12,'Elbows tight, full lockout.',0)],
     [x('Tricep Dips',3,15,'Pause briefly in the stretch.',0,BW),x('DB Hammer Curl',3,12,'Hard squeeze at the top, elbows fixed.',60)]]}])
  }},

     [x('DB Pullover',3,'12-15','Ribs down, long controlled arc.',0),x('DB Hammer Curl',3,'8-12','Hard squeeze at the top, elbows fixed.',60)],

  },
  home:{
   push:plan('free',M2_NOTE,[
    {h:'Warm-up',blocks:[warm(30,'30s')]},
    {h:'Core',blocks:[[x('DB Pullover-Leg Raise to Toe Reach',3,10,'Brace abs, long legs, back pressed down.',60,BW)]]},
    {h:'Main workout',blocks:[
     [x('DB Floor Press',4,10,'2-0-2-0. Elbows at 45 degrees, pause on the floor.',60,MINE)],
     [x('DB Standing Shoulder Press',3,12,'Slow tempo, stable core, do not arch your back.',60)],
     [x('DB Lateral Raise',3,12,'Tense hard at the top, no swinging.',60)],

});});});

function curId(){return S.date+'_'+S.day+'_'+S.prog+(S.mode==='home'?'_home':'');}
function curSession(){return S.sessions[curId()]||null;}
function ensureSession(){
  var id=curId();

function setsArr(s,key,n){
  if(!s.logs[key])s.logs[key]=[];
  while(s.logs[key].length<n)s.logs[key].push({kg:null,reps:null,done:false});
  return s.logs[key];
}
function prevFor(key,id,date){
  var best=null;
  Object.keys(S.sessions).forEach(function(sid){
    if(sid===id)return;
    var s=S.sessions[sid];
    if(!s||!s.logs||!s.logs[key]||s.date>date)return;
    if(!s.logs[key].some(has))return;
    if(!best||s.date>best.date||(s.date===best.date&&(s.updated||'')>(best.updated||'')))best=s;
  });
  return best?{date:best.date,sets:best.logs[key]}:null;
}
function fmt(it,t){
  if(!t)return '';
  var u=(it&&it.unit==='sec')?'s':'';
  var a='';
  if(t.kg!=null)a+=t.kg+'kg'+((it&&it.assist)?' assist':'');

}

var timer=null,flushing=false,again=false;

function statusInfo(){
  var m={connecting:['Connecting…',''],idle:['Ready',''],saving:['Saving…',''],saved:['Saved','ok'],error:['Not saved · tap to retry','err'],nodb:['Saved on this phone only','']};
  return m[S.conn]||m.idle;
}
function updateStatus(){
  var el=document.getElementById('st');if(!el)return;
  var i=statusInfo();el.textContent=i[0];el.className='pill '+i[1];

async function flush(){
  if(flushing){again=true;return;}
  if(!S.db){if(Object.keys(S.pending).length)setConn('nodb');return;}
  flushing=true;
  try{
    do{
      again=false;
      var ids=Object.keys(S.pending);
      for(var k=0;k<ids.length;k++){
        var id=ids[k],doc=S.sessions[id];
        if(!doc){delete S.pending[id];continue;}
        var v=S.ver[id];
        doc.updated=new Date().toISOString();
        await S.db.doc('sessions/'+id).set(clone(doc));
        if(S.ver[id]===v)delete S.pending[id];else again=true;
      }
      persistLocal();
    }while(again);
    setConn('saved');
  }catch(e){setConn('error');}
  finally{flushing=false;}
}
window.addEventListener('online',function(){if(Object.keys(S.pending).length)flush();});

function countProgress(){
  var plan=getPlan(S.prog,S.mode,S.day),s=curSession(),total=0,done=0;if(!plan)return {total:0,done:0};
  planItems(plan).forEach(function(it){
    if(it.kind==='info'){total++;if(s&&s.info&&s.info[it.key]&&s.info[it.key].done)done++;return;}
    total+=it.sets;
    var arr=s&&s.logs&&s.logs[it.key];
    if(arr)arr.forEach(function(t,i){if(i<it.sets&&t&&t.done)done++;});
  });

function sessionSummary(s){

  var act=b.getAttribute('data-act'),v=b.getAttribute('data-v'),key=b.getAttribute('data-key'),id=b.getAttribute('data-id');
  if(act==='day'){S.day=v;S.confirm=null;savePrefs();render();}
  else if(act==='prog'){S.prog=v;S.confirm=null;savePrefs();render();}
  else if(act==='mode'){S.mode=v;S.confirm=null;savePrefs();render();}
  else if(act==='view'){S.view=v;S.confirm=null;S.copyText=null;render();window.scrollTo(0,0);}
  else if(act==='today'){S.date=today();render();}
  else if(act==='retry'){if(S.conn==='error'||Object.keys(S.pending).length)flush();}
  else if(act==='tick'){
    var it=curItem(key),s=ensureSession(),arr=setsArr(s,key,it.sets),i=+b.getAttribute('data-i'),t=arr[i];
    t.done=!t.done;
    if(t.done){
      var prev=prevFor(key,curId(),S.date),before=i>0?arr[i-1]:null,pt=prev&&prev.sets[i]?prev.sets[i]:null;
      if(t.kg==null&&!it.bw)t.kg=(before&&before.kg!=null)?before.kg:(pt&&pt.kg!=null?pt.kg:null);
      if(t.reps==null)t.reps=(before&&before.reps!=null)?before.reps:(pt&&pt.reps!=null?pt.reps:topNum(it.reps));
    }
    markDirty(curId());render();
  }
  else if(act==='infoTick'){
    var s4=ensureSession();s4.info[key]=s4.info[key]||{done:false,text:''};s4.info[key].done=!s4.info[key].done;markDirty(curId());render();
  }
  else if(act==='useLast'){
    var it2=curItem(key),s5=ensureSession(),arr2=setsArr(s5,key,it2.sets),pv=prevFor(key,curId(),S.date);
    if(pv){for(var j=0;j<it2.sets;j++){var p=pv.sets[j];if(!p)continue;if(arr2[j].kg==null&&!it2.bw&&p.kg!=null)arr2[j].kg=p.kg;if(arr2[j].reps==null&&p.reps!=null)arr2[j].reps=p.reps;}markDirty(curId());render();}
  }
  else if(act==='finish'){var s6=ensureSession();s6.status=s6.status==='done'?'open':'done';markDirty(curId());render();}
  else if(act==='reset'){S.confirm='reset';render();}
  else if(act==='resetYes'){var s7=ensureSession();s7.logs={};s7.info={};s7.notes='';s7.status='open';S.confirm=null;markDirty(curId());render();}
  else if(act==='copyAll'){
    var text=buildText();
    var shown=function(){S.copied=true;S.copyText=null;render();setTimeout(function(){S.copied=false;if(S.view==='history')render(true);},2000);};
    var fallback=function(){S.copyText=text;render();};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(shown,fallback);}else fallback();
  }
  else if(act==='open'){var s8=S.sessions[id];if(s8){S.date=s8.date;S.day=s8.day;S.prog=s8.prog;S.mode=s8.mode||'gym';S.view='log';S.confirm=null;savePrefs();render();window.scrollTo(0,0);}}
  else if(act==='del'){S.confirm='del:'+id;render();}
  else if(act==='delYes'){
    S.confirm=null;delete S.pending[id];persistLocal();
    var gone=S.sessions[id];delete S.sessions[id];render();
    if(S.db){S.db.doc('sessions/'+id).delete().catch(function(){if(gone){S.sessions[id]=gone;render();}});}
  }
});

/* ---------- boot ---------- */
render();
(async function(){
  var db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}
  S.db=db;
  if(!db){S.conn=Object.keys(S.pending).length||Object.keys(S.sessions).length?'nodb':'nodb';render(true);return;}
  S.conn='idle';updateStatus();
  db.collection('sessions').orderBy('date','desc').limit(400).onSnapshot(function(snap){
    var seen={};
    snap.docs.forEach(function(d){
      seen[d.id]=true;
      if(S.pending[d.id])return;
      var data=d.data();if(data)S.sessions[d.id]=clone(data);
    });
    Object.keys(S.sessions).forEach(function(id){if(!seen[id]&&!S.pending[id])delete S.sessions[id];});
    if(S.conn==='idle'||S.conn==='connecting')S.conn='saved';
    render(true);updateStatus();
  },function(){S.conn='error';updateStatus();});
  if(Object.keys(S.pending).length)flush();
})();
})();
</script>
